<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Meine erste GitHub Page</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e94560;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            text-align: center;
            padding: 40px;
            border: 2px solid #e94560;
            border-radius: 20px;
            background: rgba(0,0,0,0.3);
        }
        h1 { font-size: 3em; margin-bottom: 10px; }
        p { color: #ccc; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🚀 Es lebt!</h1>
        <p>Meine erste GitHub Page ist online.</p>
    </div>
</body>
</html>
